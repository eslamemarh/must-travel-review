<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قالب تقييمات Must Travel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap');

  :root{
    --orange:#FF7A1A;
    --orange-deep:#D94F04;
    --plum:#3A2626;
    --cream:#FFF7EC;
    --gold:#FFC94D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal',sans-serif;
    background:#1c1412;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    min-height:100vh;
  }
  h1{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
    color:var(--orange);
  }
  p.sub{
    margin:0 0 22px;
    font-size:14px;
    color:#c9b8ae;
    text-align:center;
    max-width:420px;
    line-height:1.7;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:380px;
  }
  canvas{
    width:100%;
    height:auto;
    display:block;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    cursor:grab;
    touch-action:none;
    background:var(--orange);
  }
  canvas.dragging{cursor:grabbing;}
  .hint{
    position:absolute;
    bottom:10px;
    left:0;right:0;
    text-align:center;
    font-size:11px;
    color:rgba(255,247,236,0.7);
    pointer-events:none;
  }
  .panel{
    width:100%;
    max-width:380px;
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{display:flex;gap:10px;}
  button, .file-btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:13px 10px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active, .file-btn:active{transform:scale(0.96);}
  .primary{
    background:linear-gradient(135deg,var(--orange),var(--orange-deep));
    color:#fff;
  }
  .secondary{
    background:#2a201d;
    color:var(--cream);
    border:1px solid #4a3a34;
  }
  .zoom-row button{flex:none; width:46px; background:#2a201d; color:var(--cream); border:1px solid #4a3a34; font-size:18px;}
  input[type=file]{display:none;}
  label.file-btn{
    background:#2a201d;
    color:var(--cream);
    border:1px solid #4a3a34;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  textarea{
    width:100%;
    resize:none;
    border-radius:12px;
    border:1px solid #4a3a34;
    background:#241b18;
    color:var(--cream);
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    padding:12px;
    line-height:1.6;
  }
  .field-label{font-size:12px;color:#c9b8ae;margin-bottom:-6px;}
  .slider-block{display:flex;flex-direction:column;gap:6px;}
  .slider-row{display:flex;align-items:center;gap:10px;}
  input[type=range]{
    flex:1;
    accent-color: var(--orange);
    height:4px;
  }
  .slider-val{font-size:12px;color:var(--cream);min-width:38px;text-align:left;direction:ltr;}
  hr.sep{border:none;border-top:1px solid #3a2e29;margin:2px 0;}
</style>
</head>
<body>

<h1>قالب تقييمات Must Travel</h1>
<p class="sub">ارفع سكرين شوت المحادثة من واتساب، اسحبه جوه الإطار لتظبيط القص، وكبّر مقاس الإطار لو السكرين طويل. القالب ثابت وهتقدر تستخدمه لكل عميل جديد.</p>

<div class="stage">
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div class="hint" id="hint">اسحب الصورة لتحريكها جوه الإطار</div>
</div>

<div class="panel">

  <div class="slider-block">
    <div class="field-label">طول إطار السكرين شوت</div>
    <div class="slider-row">
      <input type="range" id="frameHeight" min="500" max="1700" step="10" value="700">
      <span class="slider-val" id="frameHeightVal">700</span>
    </div>
  </div>

  <div class="slider-block">
    <div class="field-label">عرض إطار السكرين شوت</div>
    <div class="slider-row">
      <input type="range" id="frameWidth" min="640" max="960" step="10" value="860">
      <span class="slider-val" id="frameWidthVal">860</span>
    </div>
  </div>

  <hr class="sep">

  <div class="field-label">تعليق أسفل التصميم</div>
  <textarea id="caption" rows="2" maxlength="60">ثقتكم سر نجاحنا 🌴✈️</textarea>

  <div class="row">
    <label class="file-btn" for="upload">📥 رفع سكرين شوت</label>
    <input type="file" id="upload" accept="image/*">
  </div>

  <div class="row zoom-row">
    <button id="zoomOut" class="secondary">−</button>
    <button id="zoomIn" class="secondary">+</button>
    <button id="reset" class="secondary" style="flex:1;">إعادة ضبط الصورة</button>
  </div>

  <div class="row">
    <button id="download" class="primary">⬇️ تحميل التصميم PNG</button>
  </div>
</div>

function roundRectPath(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function star(c, cx, cy, spikes, outerR, innerR){
  let rot = Math.PI/2*3;
  let x = cx, y = cy;
  const step = Math.PI/spikes;
  c.beginPath();
  c.moveTo(cx, cy-outerR);
  for(let i=0;i<spikes;i++){
    x = cx + Math.cos(rot)*outerR; y = cy + Math.sin(rot)*outerR;
    c.lineTo(x,y); rot += step;
    x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR;
    c.lineTo(x,y); rot += step;
  }
  c.lineTo(cx, cy-outerR);
  c.closePath();
}

function palmSilhouette(c, cx, topY, size, color, alpha){
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = color;
  c.fillStyle = color;
  c.lineWidth = size*0.05;
  c.lineCap = 'round';
  // trunk
  c.beginPath();
  c.moveTo(cx, topY + size*1.3);
  c.quadraticCurveTo(cx + size*0.12, topY + size*0.6, cx, topY);
  c.stroke();
  // fronds
  const frondAngles = [-70,-38,-12,14,42,72];
  frondAngles.forEach(deg=>{
    const rad = deg * Math.PI/180;
    const len = size*0.8;
    const tipX = cx + Math.sin(rad)*len;
    const tipY = topY - Math.cos(rad)*len*0.55 - size*0.08;
    const midX = cx + Math.sin(rad)*len*0.5;
    const midY = topY - len*0.32;
    c.beginPath();
    c.moveTo(cx, topY);
    c.quadraticCurveTo(midX, midY, tipX, tipY);
    c.quadraticCurveTo(midX*0.9 + cx*0.1, midY + size*0.05, cx, topY);
    c.fill();
  });
  c.restore();
}

function clampOffsets(){
  const drawW = img.width * imgScale, drawH = img.height * imgScale;
  const maxOffX = Math.max(0, (drawW - frame.w)/2);
  const maxOffY = Math.max(0, (drawH - frame.h)/2);
  offX = Math.max(-maxOffX, Math.min(maxOffX, offX));
  offY = Math.max(-maxOffY, Math.min(maxOffY, offY));
}

function draw(){
  const H = cv.height;
  ctx.clearRect(0,0,W,H);

  // background gradient
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, C.orangeLight);
  g.addColorStop(0.5, C.orange);
  g.addColorStop(1, C.orangeDeep);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // subtle vignette
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.18)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  // watermark palm (background texture, drawn as vectors so it renders the same on every device)
  palmSilhouette(ctx, 950, 270, 150, '#000000', 0.15);

  // ---- top logo (real client logo, small backdrop for contrast) ----
  const logoBoxH = 92, logoBoxW = 210, logoBoxX = 60, logoBoxY = 40;
  ctx.save();
  roundRectPath(ctx, logoBoxX, logoBoxY, logoBoxW, logoBoxH, 16);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fill();
  ctx.restore();

  if(logoReady){
    const pad = 14;
    const maxW = logoBoxW - pad*2, maxH = logoBoxH - pad*2;
    const ratio = Math.min(maxW/logo.width, maxH/logo.height);
    const lw = logo.width*ratio, lh = logo.height*ratio;
    ctx.drawImage(logo, logoBoxX + logoBoxW/2 - lw/2, logoBoxY + logoBoxH/2 - lh/2, lw, lh);
  }

  // headline
  ctx.save();
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  ctx.font = '700 96px "Aref Ruqaa", serif';
  ctx.fillStyle = 'rgba(58,38,38,0.35)';
  ctx.fillText('آراء عملائنا', W/2+4, 224);
  ctx.fillStyle = '#fff';
  ctx.fillText('آراء عملائنا', W/2, 220);
  ctx.restore();

  // stars
  ctx.save();
  ctx.fillStyle = C.gold;
  const starsY = 300, gap = 84, startX = W/2 - gap*2;
  for(let i=0;i<5;i++){
    star(ctx, startX + i*gap, starsY, 5, 30, 13);
    ctx.fill();
  }
  ctx.restore();

  // frame shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetY = 18;
  roundRectPath(ctx, frame.x, frame.y, frame.w, frame.h, frame.r);
  ctx.fillStyle = C.cream;
  ctx.fill();
  ctx.restore();

  // frame content (image or placeholder), clipped
  ctx.save();
  roundRectPath(ctx, frame.x, frame.y, frame.w, frame.h, frame.r);
  ctx.clip();

  if(img){
    const cx = frame.x + frame.w/2 + offX;
    const cy = frame.y + frame.h/2 + offY;
    const dw = img.width*imgScale, dh = img.height*imgScale;
    ctx.drawImage(img, cx-dw/2, cy-dh/2, dw, dh);
  } else {
    ctx.fillStyle = C.cream;
    ctx.fillRect(frame.x, frame.y, frame.w, frame.h);
    ctx.strokeStyle = 'rgba(58,38,38,0.35)';
    ctx.setLineDash([14,12]);
    ctx.lineWidth = 4;
    ctx.strokeRect(frame.x+14, frame.y+14, frame.w-28, frame.h-28);
    ctx.setLineDash([]);
    ctx.fillStyle = C.plum;
    ctx.font = '90px serif';
    ctx.textAlign = 'center';
    ctx.fillText('💬', frame.x+frame.w/2, frame.y+frame.h/2 - 40);
    ctx.font = '700 34px Tajawal, sans-serif';
    ctx.direction = 'rtl';
    ctx.fillText('اضغط على "رفع سكرين شوت" لإضافة رد العميل', frame.x+frame.w/2, frame.y+frame.h/2+70);
  }
  ctx.restore();

  // frame border
  ctx.save();
  roundRectPath(ctx, frame.x, frame.y, frame.w, frame.h, frame.r);
  ctx.lineWidth = 10;
  ctx.strokeStyle = C.plum;
  ctx.stroke();
  ctx.restore();

  // heart badge overlapping corner
  ctx.save();
  const hx = frame.x + 10, hy = frame.y + 10, hr = 52;
  ctx.beginPath();
  ctx.arc(hx, hy, hr, 0, Math.PI*2);
  ctx.fillStyle = C.heart;
  ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=16; ctx.shadowOffsetY=6;
  ctx.fill();
  ctx.shadowColor='transparent';
  ctx.lineWidth = 6;
  ctx.strokeStyle = C.cream;
  ctx.stroke();
  ctx.font = '52px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('❤️', hx, hy+2);
  ctx.restore();

  // footer caption
  ctx.save();
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  ctx.font = '800 46px Tajawal, sans-serif';
  ctx.fillStyle = 'rgba(58,38,38,0.35)';
  const capText = document.getElementById('caption').value || 'ثقتكم سر نجاحنا 🌴✈️';
  ctx.fillText(capText, W/2+3, frame.y+frame.h+90);
  ctx.fillStyle = '#fff';
  ctx.fillText(capText, W/2, frame.y+frame.h+87);
  ctx.restore();
}

// ---- font + logo loading then first draw ----
if (document.fonts && document.fonts.load) {
  document.fonts.load('700 96px "Aref Ruqaa"').then(()=>document.fonts.load('800 46px Tajawal')).then(draw).catch(draw);
} else {
  draw();
}
setTimeout(draw, 400); // fallback in case font promise stalls

// ---- upload handling ----
document.getElementById('upload').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const image = new Image();
    image.onload = ()=>{
      img = image;
      // fit by width only, so text lines are never cropped left/right —
      // any extra height just gets cropped/panned vertically instead
      const scaleW = frame.w / img.width;
      minScale = scaleW;
      imgScale = minScale;
      offX = 0; offY = 0;
      draw();
    };
    image.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ---- drag to pan (mouse + touch) ----
cv.addEventListener('pointerdown', (e)=>{
  if(!img) return;
  dragging = true;
  cv.classList.add('dragging');
  lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e)=>{
  if(!dragging || !img) return;
  const rect = cv.getBoundingClientRect();
  const scaleX = cv.width/rect.width, scaleY = cv.height/rect.height;
  offX += (e.clientX-lastX)*scaleX;
  offY += (e.clientY-lastY)*scaleY;
  lastX = e.clientX; lastY = e.clientY;
  clampOffsets();
  draw();
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  cv.addEventListener(ev, ()=>{ dragging=false; cv.classList.remove('dragging'); });
});

// ---- zoom controls ----
document.getElementById('zoomIn').addEventListener('click', ()=>{
  if(!img) return;
  imgScale = Math.min(minScale*3, imgScale*1.15);
  clampOffsets(); draw();
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  if(!img) return;
  imgScale = Math.max(minScale, imgScale/1.15);
  clampOffsets(); draw();
});
document.getElementById('reset').addEventListener('click', ()=>{
  if(!img) return;
  imgScale = minScale; offX = 0; offY = 0; draw();
});

// ---- frame size sliders ----
function onFrameResize(){
  frame.w = parseInt(document.getElementById('frameWidth').value, 10);
  frame.x = W/2 - frame.w/2;
  frame.h = parseInt(document.getElementById('frameHeight').value, 10);
  document.getElementById('frameWidthVal').textContent = frame.w;
  document.getElementById('frameHeightVal').textContent = frame.h;
  recalcCanvasHeight();
  if(img){
    const scaleW = frame.w / img.width;
    minScale = scaleW;
    if(imgScale < minScale) imgScale = minScale;
    clampOffsets();
  }
  draw();
}
document.getElementById('frameHeight').addEventListener('input', onFrameResize);
document.getElementById('frameWidth').addEventListener('input', onFrameResize);

// ---- caption live update ----
document.getElementById('caption').addEventListener('input', draw);

// ---- download ----
document.getElementById('download').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'must-travel-review.png';
  link.href = cv.toDataURL('image/png', 1.0);
  link.click();
});
</script>
